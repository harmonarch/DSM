name: Release

# 推送 v* 标签（如 v0.1.0）时自动构建并发布 GitHub Release（macOS DMG + ZIP 更新包 + Windows ZIP + Android APK + SHA256SUMS）
on:
  push:
    tags: ["v*"]

jobs:
  version-check:
    name: Version Check（tag 与代码版本号一致）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 拦住「打了 v0.1.5 标签但代码里还是 0.1.4」——否则会发出版本号错误的 Release
      - name: Check tag matches four-platform version
        run: bash Scripts/check-version-sync.sh "${GITHUB_REF_NAME}"

  build-macos:
    name: Build macOS
    runs-on: macos-15
    needs: version-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release .app
        run: bash Scripts/build-app.sh release

      - name: Read version
        run: |
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/DeepSeekMeter.app/Contents/Info.plist)
          echo "VERSION=$V" >> $GITHUB_ENV
          echo "版本：$V"

      - name: Package DMG（拖拽安装）
        run: |
          STAGE=$(mktemp -d)
          cp -R build/DeepSeekMeter.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "DeepSeekMeter" -srcfolder "$STAGE" -ov -format UDZO "build/DSM-${VERSION}-macOS.dmg"

      - name: Package ZIP（应用内更新包；ditto 保留签名与元数据）
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/DeepSeekMeter.app "build/DSM-${VERSION}-macOS.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-dmg
          path: |
            build/DSM-*-macOS.dmg
            build/DSM-*-macOS.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: version-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained x64
        shell: pwsh
        run: |
          dotnet publish windows/src/DeepSeekMeter/DeepSeekMeter.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o windows/publish/win-x64

      - name: Package ZIP
        shell: pwsh
        run: |
          $stage = "windows/publish/DSM-win-x64"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path "windows/publish/win-x64/*" -Destination $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath "windows/publish/DSM-win-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: windows/publish/DSM-win-x64.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: version-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 只装 platform-tools：action 默认的 "tools" 包已被 Google 从 SDK 仓库下架，
          # 装它会以 "Failed to find package 'tools'" 让 sdkmanager 退出 1（整步失败）
          packages: platform-tools

      - name: Restore release keystore（固定签名，跨版本覆盖安装的前提）
        env:
          DSM_KEYSTORE_BASE64: ${{ secrets.DSM_KEYSTORE_BASE64 }}
          DSM_RELEASE_STORE_PASSWORD: ${{ secrets.DSM_RELEASE_STORE_PASSWORD }}
        run: |
          if [ -n "$DSM_KEYSTORE_BASE64" ]; then
            KS="$RUNNER_TEMP/dsm-release.keystore"
            echo "$DSM_KEYSTORE_BASE64" | base64 --decode > "$KS"
            {
              echo "DSM_RELEASE_STORE_FILE=$KS"
              echo "DSM_RELEASE_STORE_PASSWORD=$DSM_RELEASE_STORE_PASSWORD"
              echo "DSM_RELEASE_KEY_ALIAS=dsm"
              echo "DSM_RELEASE_KEY_PASSWORD=$DSM_RELEASE_STORE_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "已从 Secret 恢复固定签名密钥（alias=dsm）"
          else
            echo "未配置 DSM_KEYSTORE_BASE64 Secret，本次 APK 回退 debug 签名（应用内更新将无法覆盖安装）"
          fi

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew :core:test :app:assembleRelease --no-daemon

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  release:
    name: Publish Release
    needs: [build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macOS-dmg
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Rename Android APK (with version)
        run: mv artifacts/app-release.apk "artifacts/DSM-$GITHUB_REF_NAME-android.apk"

      - name: Generate SHA256SUMS（应用内更新下载后校验哈希用）
        run: |
          cd artifacts
          sha256sum DSM-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
